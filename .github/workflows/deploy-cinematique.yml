# ============================================================================
# Déploiement du site cinématique ArkAdiA — RACINE de gldigitallab.fr
#
# ⭐ POURQUOI CE FICHIER EXISTE, ET POURQUOI IL EST SÉPARÉ.
#
# Le site cinématique est un site STATIQUE de 23,5 Mio : une séquence d'ouverture
# de 118 images, deux modèles 3D, un moteur en modules ES. Il n'a rien à
# construire — il EST le livrable.
#
# ⛔ IL A D'ABORD ÉTÉ DÉPOSÉ DANS `public/`, pour profiter du build Vite et du
#    déploiement existant. C'était une erreur, et elle est mesurée : le build a
#    échoué au postbuild, `scripts/relever-dans-html.mjs` n'a pas trouvé les 11
#    zones `data-etat` de `dist/etat-du-studio/index.html`, et `Deploy Production`
#    a été SAUTÉ. Conséquence : rien n'est parti pour le site cinématique, et le
#    site du studio n'a pas été mis à jour non plus.
#    ⇒ Un livrable statique dans une chaîne de build, c'est 23 Mio ajoutés au
#      prérendu — qui charge chaque page dans Chrome — pour zéro bénéfice.
#
# ⭐ DÉCISION DE GAËTAN, 26/09/2026 : LE SITE CINÉMATIQUE PREND LA RACINE.
#    « https://gldigitallab.fr/cinematique/ <= non, à la base du site ! »
#    ⇒ `server-dir: /public_html/`, la racine du domaine.
#
# ⚠️ CE QUE ÇA IMPLIQUE, ET QUI A ÉTÉ TRAITÉ — les deux allaient se marcher dessus :
#    1. Le pipeline du site précédent se déclenchait à chaque push sur `main` et
#       réécrivait `index.html`. Il est passé en déclenchement MANUEL : sans ça,
#       il aurait repris l'accueil au premier push suivant, en silence.
#       Rien n'est supprimé pour autant — il reste lançable à la main.
#    2. Le précédent site installait un service worker sur tout le domaine. S'il
#       en restait un, les visiteurs déjà venus verraient l'ANCIENNE page servie
#       par leur cache, sans qu'aucune erreur n'apparaisse. `cinematique/sw.js`
#       le remplace et se désinscrit une fois, chez chaque visiteur.
#
# ⚠️ `dangerous-clean-slate: false` : cet envoi ÉCRASE les fichiers de même nom
#    et NE SUPPRIME RIEN d'autre. Les autres fichiers du site précédent restent
#    sur le serveur — on n'efface pas, on remplace l'accueil.
#
# ⚠️ LES TROIS SECRETS SONT CEUX DU DÉPÔT, DÉJÀ EN PLACE :
#    FTP_SERVER · FTP_USERNAME · FTP_PASSWORD (posés le 07/01/2026).
# ============================================================================
name: 🎬 Site cinématique

on:
  push:
    branches: [main]
    paths:
      - 'cinematique/**'
      - 'redirection-cinematique/**'
      - '.github/workflows/deploy-cinematique.yml'
  workflow_dispatch:

jobs:
  cinematique:
    name: 📤 Cinématique → gldigitallab.fr
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔎 Ce qu'on s'apprête à publier
        run: |
          if [ ! -f cinematique/index.html ]; then
            echo "⛔ cinematique/index.html est absent : rien à publier."
            exit 1
          fi
          echo "index.html présent : $(wc -c < cinematique/index.html) octets"
          echo "fichiers           : $(find cinematique -type f | wc -l)"
          echo "poids              : $(du -sh cinematique | cut -f1)"
          echo ""
          echo "Chemins absolus dans le HTML (doit valoir 0 — le site doit marcher à la racine comme en sous-dossier) :"
          grep -o 'src="/[^"]*"' cinematique/index.html | wc -l
          echo "Service worker de desinscription present :"
          test -f cinematique/sw.js && echo "  oui" || echo "  NON — le cache de l'ancien site pourrait survivre"

      - name: 🚀 Envoi FTP vers la RACINE
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cinematique/
          server-dir: /public_html/
          # ⛔⛔ PROTECTION DES PAGES DU STUDIO — AJOUTEE LE 26/09/2026 APRES UNE PANNE.
          #
          # ⚠️ CE QUI S'EST PASSE, LU DANS LE LOG DU RUN :
          #      removing "vendor/three.min.js"
          #      removing folder "//public_html/api"
          #      FTPError: 550 Can't change directory to //public_html/api
          #    Les 48 pages du studio sont passees en 404 — /dossier, /demos/, /univers/,
          #    /plan/, /components, /le-pont/, /monde/.
          #
          # ⛔ LA CAUSE : cette etape deploie ./cinematique/ vers /public_html/ — la RACINE —
          #    et l'action FTP **supprime en distant tout ce qui n'est pas dans local-dir**.
          #    ⚠️ Et `dangerous-clean-slate: false` n'empeche RIEN de cela : ce reglage ne
          #       concerne que le nettoyage complet, pas la synchronisation incrementale.
          #
          # ⭐ LA LISTE CI-DESSOUS N'EST PAS ECRITE A LA MAIN : elle est DERIVEE de dist/,
          #    par `scripts/proteger-pages-studio.mjs`, qui refuse d'ecrire si une page
          #    connue comme cassee n'y figure pas. *Un chiffre ecrit a la main devient faux
          #    sans le dire.*
          #
          # ⚠️ Regenerer apres toute page nouvelle : node scripts/proteger-pages-studio.mjs
          exclude: |
          404.html
          api/**
          apple-touch-icon.png
          apple-touch-icon.svg
          apps/**
          Arche/**
          arkadia/**
          arkadia-labo/**
          armure/**
          assets/**
          ce-que-nous-nous-imposons/**
          cgv/**
          cinematique/**
          components/**
          confidentialite/**
          contact/**
          demo-conformite/**
          demo-festival-metz/**
          demos/**
          dossier/**
          etat-du-studio/**
          eva01/**
          favicon-16x16.png
          favicon-192x192.png
          favicon-32x32.png
          favicon-512x512.png
          favicon.ico
          favicon.svg
          fonts/**
          galion/**
          galion-arkadia.glb
          galion.glb
          guides/**
          ia-de-bord/**
          laboratoire/**
          le-pont/**
          liens/**
          llms.txt
          logos/**
          mentions-legales/**
          modeles/**
          models/**
          monde/**
          offline.html
          og-image.png
          og-image.svg
          og-navire.jpg
          plan/**
          projets/**
          ressources/**
          robots.txt
          screenshots/**
          services/**
          site.webmanifest
          sitemap/**
          sitemap.xml
          soute/**
          sw.js
          TARDIS/**
          univers/**
          vendor/**
          vitrine/**
          voyageo-pro/**
          world/**
          dangerous-clean-slate: false

      - name: 🚚 Rediriger l'ancienne adresse /cinematique/ vers la racine
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./redirection-cinematique/
          server-dir: /public_html/cinematique/
          dangerous-clean-slate: false

      - name: ✅ Vérifier ce qui est en ligne
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" -L https://gldigitallab.fr/)
          echo "https://gldigitallab.fr/ → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "⛔ La racine ne répond pas 200 après l'envoi."
            exit 1
          fi
          # Le titre est la seule preuve simple que c'est BIEN le site cinématique
          # qui répond, et pas l'ancien resté en place.
          titre=$(curl -s -L https://gldigitallab.fr/ | grep -o '<title>[^<]*</title>' | head -1)
          echo "titre servi : $titre"
          echo "$titre" | grep -q 'GL Digital Lab' || {
            echo "⚠️ Le titre ne porte pas la signature attendue — vérifier à la main."
          }
          # Et l'ancienne adresse doit REDIRIGER, plus servir la page morte.
          code2=$(curl -s -o /dev/null -w "%{http_code}" https://gldigitallab.fr/cinematique/)
          echo "https://gldigitallab.fr/cinematique/ → HTTP $code2 (301 attendu)"
          echo "✅ La racine répond."
