# ============================================================================
# Déploiement du site cinématique ArkAdiA — RACINE de gldigitallab.fr
#
# ⭐ POURQUOI CE FICHIER EXISTE, ET POURQUOI IL EST SÉPARÉ.
#
# Le site cinématique est un site STATIQUE de 23,5 Mio : une séquence d'ouverture
# de 118 images, deux modèles 3D, un moteur en modules ES. Il n'a rien à
# construire — il EST le livrable.
#
# ⛔ IL A D'ABORD ÉTÉ DÉPOSÉ DANS `public/`, pour profiter du build Vite et du
#    déploiement existant. C'était une erreur, et elle est mesurée : le build a
#    échoué au postbuild, `scripts/relever-dans-html.mjs` n'a pas trouvé les 11
#    zones `data-etat` de `dist/etat-du-studio/index.html`, et `Deploy Production`
#    a été SAUTÉ. Conséquence : rien n'est parti pour le site cinématique, et le
#    site du studio n'a pas été mis à jour non plus.
#    ⇒ Un livrable statique dans une chaîne de build, c'est 23 Mio ajoutés au
#      prérendu — qui charge chaque page dans Chrome — pour zéro bénéfice.
#
# ⭐ DÉCISION DE GAËTAN, 26/09/2026 : LE SITE CINÉMATIQUE PREND LA RACINE.
#    « https://gldigitallab.fr/cinematique/ <= non, à la base du site ! »
#    ⇒ `server-dir: /public_html/`, la racine du domaine.
#
# ⚠️ CE QUE ÇA IMPLIQUE, ET QUI A ÉTÉ TRAITÉ — les deux allaient se marcher dessus :
#    1. Le pipeline du site précédent se déclenchait à chaque push sur `main` et
#       réécrivait `index.html`. Il est passé en déclenchement MANUEL : sans ça,
#       il aurait repris l'accueil au premier push suivant, en silence.
#       Rien n'est supprimé pour autant — il reste lançable à la main.
#    2. Le précédent site installait un service worker sur tout le domaine. S'il
#       en restait un, les visiteurs déjà venus verraient l'ANCIENNE page servie
#       par leur cache, sans qu'aucune erreur n'apparaisse. `cinematique/sw.js`
#       le remplace et se désinscrit une fois, chez chaque visiteur.
#
# ⚠️ `dangerous-clean-slate: false` : cet envoi ÉCRASE les fichiers de même nom
#    et NE SUPPRIME RIEN d'autre. Les autres fichiers du site précédent restent
#    sur le serveur — on n'efface pas, on remplace l'accueil.
#
# ⚠️ LES TROIS SECRETS SONT CEUX DU DÉPÔT, DÉJÀ EN PLACE :
#    FTP_SERVER · FTP_USERNAME · FTP_PASSWORD (posés le 07/01/2026).
# ============================================================================
name: 🎬 Site cinématique

on:
  push:
    branches: [main]
    paths:
      - 'cinematique/**'
      - 'redirection-cinematique/**'
      - '.github/workflows/deploy-cinematique.yml'
      # ⛔⛔ `outils/**` AJOUTÉ LE 28/09/2026 — LE WORKFLOW NE SURVEILLAIT PAS SES PROPRES OUTILS.
      #    ⚠️ MESURE : le déploiement exécute QUATRE outils de `outils/` —
      #      `verifier-publication.mjs`, `generer-sitemap.mjs`, `versionner-ressources.mjs`,
      #      et le contrôle de surface. Les corriger ne déclenchait RIEN.
      #    ⭐ Le cas s'est produit : j'ai corrigé `versionner-ressources.mjs` (un chemin
      #      machine en dur qui faisait ÉCHOUER le déploiement), je l'ai poussé —
      #      et **aucun redéploiement n'est parti**. Le site est resté sur la version
      #      cassée, et seul le workflow `Qualité` a tourné, vert.
      #    ⇒ *Un outil que le déploiement exécute fait partie du déploiement. S'il n'est
      #      pas dans le filtre, on peut le réparer sans que rien ne se répare.*
      - 'outils/**'
  workflow_dispatch:

jobs:
  cinematique:
    name: 📤 Cinématique → gldigitallab.fr
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔎 Ce qu'on s'apprête à publier
        run: |
          if [ ! -f cinematique/index.html ]; then
            echo "⛔ cinematique/index.html est absent : rien à publier."
            exit 1
          fi
          echo "index.html présent : $(wc -c < cinematique/index.html) octets"
          echo "fichiers           : $(find cinematique -type f | wc -l)"
          echo "poids              : $(du -sh cinematique | cut -f1)"
          echo ""
          echo "Chemins absolus dans le HTML (doit valoir 0 — le site doit marcher à la racine comme en sous-dossier) :"
          grep -o 'src="/[^"]*"' cinematique/index.html | wc -l
          echo "Service worker de desinscription present :"
          test -f cinematique/sw.js && echo "  oui" || echo "  NON — le cache de l'ancien site pourrait survivre"

      # ⛔⛔ LA PORTE DE PUBLICATION — AJOUTÉE LE 29/09/2026, APRÈS UNE FUITE TROUVÉE PAR HASARD.
      #
      # ⚠️ CE QUI S'EST PASSÉ, ET C'EST LA LOI 4 DE L'ATELIER EN PLEIN :
      #    *« un garde-fou qui ne couvre qu'un chemin est une porte. »*
      #
      #    Le studio POSSÉDAIT déjà `forge-ia/verifier-publication.mjs` — 7 motifs,
      #    auto-épreuve 6/6, 0 faux positif. Il ne tournait QUE sur deux dossiers du
      #    dépôt du studio (`communication/`, `livrables/dossier-presentation`).
      #    Le SITE n'était couvert nulle part.
      #
      #    Mesure du 29/09/2026, en le lançant à la main sur la page d'accueil :
      #      L351  <h2>Le Laboratoire (EVA-01 & ArkAdiA)</h2>     → titre de section
      #      L366  <li><strong>EVA-01</strong> — le poste : …       → la pile du studio
      #      L632  <div class="badge-dept">PÔLE 02 // EVA-01</div> → badge affiché
      #      L94   commentaire HTML citant EVA-01
      #      L592  commentaire citant `C:\IA\ArkAdiA\visuels\`
      #    ⇒ 5 bloquants, dont 3 VISIBLES PAR LE VISITEUR. Le nom d'hôte de la machine
      #      de production était PUBLIÉ, en titre de section, sur le site public.
      #
      # ⭐ POURQUOI ICI ET PAS DANS UN `pre-commit` :
      #    `portfolio-gaetan` est un dépôt SÉPARÉ de `gl-digital-lab` (vérifié : aucun
      #    hook, `core.hooksPath` vide). Un pre-commit du studio ne verra jamais un
      #    commit du site. **Le point de passage obligé de toute publication, c'est ce
      #    workflow** — un fichier publié passe forcément par lui. C'est donc là que la
      #    porte doit vivre.
      #
      # ⚠️ L'OUTIL EST VERSIONNÉ DANS CE DÉPÔT (`outils/verifier-publication.mjs`),
      #    copie de `forge-ia/verifier-publication.mjs` du studio. Un workflow ne peut
      #    appeler que ce qui est dans le dépôt qu'il construit. Si la copie dérive,
      #    c'est ici qu'on le verra — et le job échouera AVANT l'envoi FTP.
      #
      # ⛔ CE QUE CE CONTRÔLE NE FAIT PAS : il ne vérifie QUE la question 2 de la règle
      #    `REGLE-ce-qui-se-publie-2026-09-28.md` — « contient-il ce qui n'est pas à
      #    nous de dire ? ». Il ne dit PAS qu'une page est publiable : les questions
      #    1 (utile ?), 3 (vérifiable ?) et 4 (engage le studio ?) sont humaines.
      - name: 🛡 Publication — rien de ce qui n'est pas à nous de dire
        run: |
          echo "Auto-épreuve du vérificateur (il doit MORDRE, sinon il ne prouve rien) :"
          node outils/verifier-publication.mjs --auto | tail -4
          echo ""
          CIBLES=$(find cinematique -type f \( -name '*.html' -o -name '*.md' -o -name '*.txt' \
                   -o -name '*.xml' -o -name '*.css' -o -name '*.js' -o -name '*.mjs' -o -name '*.json' \) \
                   | grep -v '/sources/' || true)
          if [ -z "$CIBLES" ]; then
            echo "⛔ Aucun fichier à vérifier — ce n'est pas « tout va bien », c'est un contrôle aveugle."
            exit 1
          fi
          echo "Fichiers vérifiés : $(echo "$CIBLES" | wc -l)"
          if ! node outils/verifier-publication.mjs $CIBLES; then
            echo ""
            echo "⛔ PUBLICATION REFUSÉE — un fichier destiné à sortir contient ce qui n'est pas à nous de dire."
            echo "   → Règle : vault-agence/REGLE-ce-qui-se-publie-2026-09-28.md (question 2)"
            echo "   → Ce commit N'A PAS été envoyé sur le serveur. La production est intacte."
            exit 1
          fi
          echo "✅ Publication : rien de ce qui est interdit."

      # ⛔ LE PLAN DE SITE EST-IL À JOUR ? — ajouté le 29/09/2026, sur un défaut mesuré.
      #
      # ⚠️ CE QUI A ÉTÉ TROUVÉ : `cinematique/sitemap.xml` déclarait 5 URLs quand le site
      #    en servait 9. **Quatre pages publiées et vérifiées en 200 n'étaient déclarées
      #    nulle part** — `/analyses/`, `/formation/` et le dossier pédagogique.
      #    ⇒ Une page que le plan ignore est une page que les moteurs trouvent par hasard.
      #
      # ⛔ ET SON EN-TÊTE MENTAIT : il attribuait la génération à
      #    `outils-pilotage/veille-generer-articles.mjs`, un script qui porte
      #    `const SITE = 'C:\IA\ArkAdiA\cinematique-neo'` — **un chemin absolu en dur vers
      #    un AUTRE projet.** Il n'a jamais écrit ce fichier.
      #    *Un en-tête qui décrit une intention non tenue est pire qu'aucun en-tête : il
      #    fait croire que le contrôle a eu lieu.*
      #
      # ⇒ Le plan est désormais ENGENDRÉ par `outils/generer-sitemap.mjs`, qui DÉCOUVRE
      #   les pages sur le disque au lieu de recopier une liste écrite à la main.
      #   Le mode `--verifier` **n'écrit rien** : il compare et échoue si le plan a dérivé.
      #   ⛔ On ne le régénère PAS à la volée dans ce workflow : un pipeline qui répare
      #      l'artefact qu'il publie masque la dérive au lieu de la signaler. Le plan est
      #      mis à jour par un humain, et la porte refuse de publier tant qu'il ne l'est pas.
      - name: 🗺 Plan de site — à jour ?
        run: |
          node outils/generer-sitemap.mjs --verifier

      # ⛔⛔ LA PORTE DU CACHE — AJOUTÉE LE 28/09/2026, APRÈS UN DÉFAUT PAYÉ.
      #    Les feuilles de style étaient appelées avec `?v=20260928` : une DATE ÉCRITE
      #    À LA MAIN, dans 14 pages. Elle ne changeait pas quand le fichier changeait.
      #    ⭐ Conséquence RÉELLE, vécue : après avoir corrigé la mise en page du hero, ma
      #      capture était IDENTIQUE à la précédente — même empreinte SHA256. Le navigateur
      #      servait l'ancien CSS. *Le correctif était bon ; c'est ce que je regardais
      #      qui était périmé.*
      #    ⇒ Ce pas recalcule le sha256 de chaque ressource et réécrit le `?v=`.
      #      Il tourne AVANT l'envoi, donc ce qui part en ligne porte l'empreinte du
      #      contenu réellement envoyé.
      #    ⚠️ Et il `git diff --exit-code` APRÈS : si un `?v=` a changé, c'est qu'un
      #      ressource a été modifiée sans que sa version soit mise à jour dans le dépôt.
      #      On ne bloque pas la publication pour ça — on le SIGNALE, parce que bloquer
      #      ferait échouer un déploiement pour un détail cosmétique. Mais le journal le dit.
      - name: 🔖 Cache — les versions sont-elles les empreintes du contenu ?
        run: |
          echo "Avant réécriture :"
          git diff --stat -- cinematique/ | tail -3 || true
          node outils/versionner-ressources.mjs
          echo ""
          echo "Après réécriture :"
          if git diff --quiet -- cinematique/; then
            echo "✅ Aucune version n'avait dérivé."
          else
            echo "⚠️  Des versions ont été corrigées AU MOMENT DU DÉPLOIEMENT."
            echo "    Cela veut dire qu'une ressource a changé sans que sa version"
            echo "    soit recalculée dans le dépôt. Le site publié est CORRECT"
            echo "    (l'empreinte est celle du contenu envoyé), mais le dépôt, lui,"
            echo "    portait une version périmée. Relancer l'outil après un changement"
            echo "    de CSS :  node outils/versionner-ressources.mjs"
            git diff --stat -- cinematique/ | tail -5
          fi

      - name: 🚀 Envoi FTP vers la RACINE
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./cinematique/
          server-dir: /public_html/
          # ⛔⛔ PROTECTION DES PAGES DU STUDIO — AJOUTEE LE 26/09/2026 APRES UNE PANNE.
          #
          # ⚠️ CE QUI S'EST PASSE, LU DANS LE LOG DU RUN :
          #      removing "vendor/three.min.js"
          #      removing folder "//public_html/api"
          #      FTPError: 550 Can't change directory to //public_html/api
          #    Les 48 pages du studio sont passees en 404 — /dossier, /demos/, /univers/,
          #    /plan/, /components, /le-pont/, /monde/.
          #
          # ⛔ LA CAUSE : cette etape deploie ./cinematique/ vers /public_html/ — la RACINE —
          #    et l'action FTP **supprime en distant tout ce qui n'est pas dans local-dir**.
          #    ⚠️ Et `dangerous-clean-slate: false` n'empeche RIEN de cela : ce reglage ne
          #       concerne que le nettoyage complet, pas la synchronisation incrementale.
          #
          # ⭐ LA LISTE CI-DESSOUS N'EST PAS ECRITE A LA MAIN : elle est DERIVEE de dist/,
          #    par `scripts/proteger-pages-studio.mjs`, qui refuse d'ecrire si une page
          #    connue comme cassee n'y figure pas. *Un chiffre ecrit a la main devient faux
          #    sans le dire.*
          #
          # ⚠️ Regenerer apres toute page nouvelle : node scripts/proteger-pages-studio.mjs
          exclude: |
            api/**
            apple-touch-icon.png
            apple-touch-icon.svg
            apps/**
            Arche/**
            arkadia/**
            arkadia-labo/**
            armure/**
            assets/**
            ce-que-nous-nous-imposons/**
            cgv/**
            cinematique/**
            components/**
            confidentialite/**
            contact/**
            demo-conformite/**
            demo-festival-metz/**
            demos/**
            dossier/**
            etat-du-studio/**
            eva01/**
            favicon-16x16.png
            favicon-192x192.png
            favicon-32x32.png
            favicon-512x512.png
            fonts/**
            galion/**
            galion-arkadia.glb
            galion.glb
            guides/**
            ia-de-bord/**
            laboratoire/**
            le-pont/**
            liens/**
            logos/**
            mentions-legales/**
            modeles/boutique-boreal/catalogue/index.html
            modeles/boutique-boreal/commande/index.html
            modeles/boutique-boreal/index.html
            modeles/boutique-boreal/panier/index.html
            models/**
            monde/**
            offline.html
            og-image.png
            og-image.svg
            og-navire.jpg
            plan/**
            projets/**
            ressources/**
            screenshots/**
            # ⛔ « services/** » A ÉTÉ RETIRÉ DE CETTE LISTE LE 28/09/2026 — DÉCISION DE GAËTAN.
            #    Cette exclusion PROTÉGEAIT une page du pipeline Vue arrêté le 26/09 :
            #    /services/ servait 135 Ko d'une page « Génie IT TeK FR » SANS AUCUNE
            #    SOURCE dans le dépôt, avec des prix qui ne sont pas les nôtres
            #    (450 €/jour, audit 149-199 €) — mesuré en ligne le 28/09.
            #    ⭐ L'exclusion avait été écrite pour EMPÊCHER la synchronisation de la
            #      supprimer. Elle empêchait surtout la nouvelle page d'arriver.
            #    ⇒ cinematique/services/index.html est désormais la SEULE version, et
            #      sitemap.xml la déclare. *Une page servie sans source n'est pas un
            #      contenu : c'est une fuite qu'on ne peut pas corriger.*
            site.webmanifest
            sitemap/**
            soute/**
            TARDIS/**
            univers/**
            vendor/three.min.js
            vitrine/**
            voyageo-pro/**
            world/**
          dangerous-clean-slate: false

      - name: 🚚 Rediriger l'ancienne adresse /cinematique/ vers la racine
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./redirection-cinematique/
          server-dir: /public_html/cinematique/
          dangerous-clean-slate: false

      - name: ✅ Vérifier ce qui est en ligne
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" -L https://gldigitallab.fr/)
          echo "https://gldigitallab.fr/ → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "⛔ La racine ne répond pas 200 après l'envoi."
            exit 1
          fi
          # Le titre est la seule preuve simple que c'est BIEN le site cinématique
          # qui répond, et pas l'ancien resté en place.
          titre=$(curl -s -L https://gldigitallab.fr/ | grep -o '<title>[^<]*</title>' | head -1)
          echo "titre servi : $titre"
          echo "$titre" | grep -q 'GL Digital Lab' || {
            echo "⚠️ Le titre ne porte pas la signature attendue — vérifier à la main."
          }
          # Et l'ancienne adresse doit REDIRIGER, plus servir la page morte.
          code2=$(curl -s -o /dev/null -w "%{http_code}" https://gldigitallab.fr/cinematique/)
          echo "https://gldigitallab.fr/cinematique/ → HTTP $code2 (301 attendu)"
          # ⛔⛔ LA VÉRIFICATION QUI MANQUAIT — AJOUTÉE LE 28/09/2026 APRÈS UN DÉFAUT MESURÉ.
          #
          # ⭐ CE QUI S'EST PASSÉ, ET C'EST LE DÉFAUT QUE CE BLOC RÉPARE :
          #    le commit `ba22939` a publié une page `ressources/` et un PDF de **327 Ko**.
          #    Le workflow a rendu **`success` sur TOUTES ses étapes** — y compris celle-ci.
          #    ⛔ **Et le PDF rendait 404, la page rendait 403.**
          #
          #    ⭐ LA CAUSE, ET ELLE EST ÉCRITE DANS LES TROIS LIGNES DU DESSUS :
          #      ce contrôle vérifie la **page d'accueil** — qui répondait 200 **avant**
          #      le déploiement et répondra 200 **après**, quoi qu'il arrive.
          #      ⇒ *Un contrôle qui vérifie ce qui était déjà vert ne vérifie rien.*
          #      **Il ne testait AUCUN des fichiers envoyés.**
          #
          # ⇒ ⭐ ON VÉRIFIE MAINTENANT **CE QUI VIENT D'ÊTRE ENVOYÉ**, pas ce qui marchait déjà.
          #    ⚠️ La liste est écrite ici, et c'est imparfait : *une liste écrite à la main
          #      oubliera un jour* — c'est le défaut payé six fois sur `indexer-agence.js`.
          #      Mais **elle porte sa raison**, et un fichier oublié ici se voit tout de suite.
          #
          # ⛔⛔ ET CE BLOC A MORDU — SUR NOUS, LE 28/09/2026. TROIS RUNS ROUGES D'AFFILÉE.
          #    La liste portait `ressources/` — un chemin **qui n'existe plus** depuis que la
          #    page a été renommée `formation/` (Gaëtan : *« c'est pas sujet ÉCOLE en tant que
          #    tel »*, puis `formation/`).
          #    ⇒ Le contrôle échouait **à chaque déploiement, pour la mauvaise raison** —
          #      et **la page n'était pas mise à jour** (`/formation/` servait encore le titre
          #      « Ressources pédagogiques »).
          #    ⭐ *C'est EXACTEMENT le défaut qu'il devait attraper : une liste écrite à la
          #      main devient fausse sans le dire.* **Le remède a le défaut qu'il soigne.**
          #    ⚠️ **METTRE CETTE LISTE À JOUR À CHAQUE RENOMMAGE DE PAGE.** C'est le prix —
          #      et c'est moins cher que de ne rien vérifier du tout.
          echo ""
          echo "── Vérification des fichiers publiés ──"
          echec=0
          for f in \
            "formation/" \
            "formation/DOSSIER-PEDAGOGIQUE-MANGA-PRIMAIRE.pdf" \
            "formation/DOSSIER-PEDAGOGIQUE-MANGA-PRIMAIRE.md" \
            "veille/" \
            "llms.txt" \
            ".well-known/security.txt"
          do
            # ⚠️ `-L` suivi des redirections ; on veut le code FINAL.
            fc=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "https://gldigitallab.fr/$f")
            if [ "$fc" = "200" ]; then
              echo "  ✅ HTTP $fc  /$f"
            else
              # ⚠️ On RÉESSAIE une fois, plus tard : le FTP peut être encore en train d'écrire.
              sleep 20
              fc=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "https://gldigitallab.fr/$f")
              if [ "$fc" = "200" ]; then
                echo "  ✅ HTTP $fc  /$f  (au second essai — le FTP a mis du temps)"
              else
                echo "  ⛔ HTTP $fc  /$f  — CE FICHIER N'EST PAS EN LIGNE"
                echec=1
              fi
            fi
          done
          if [ "$echec" = "1" ]; then
            echo ""
            echo "⛔⛔ AU MOINS UN FICHIER ENVOYÉ N'EST PAS ACCESSIBLE."
            echo "    ⇒ L'envoi FTP a été TENTÉ, mais il n'a pas abouti pour tout."
            echo "    ⇒ *Le succès de l'étape d'envoi ne prouve pas la livraison.*"
            echo "    Regarder le journal de l'étape 🚀, puis relancer si le transfert a échoué."
            exit 1
          fi
          echo "✅ Tous les fichiers vérifiés répondent 200."
          # ⛔⛔ ET 200 NE SUFFIT PAS — AJOUTÉ LE 28/09/2026 APRÈS UN DÉFAUT MESURÉ.
          #
          # ⭐ CE QUI S'EST PASSÉ, ET C'EST LA DEUXIÈME COUCHE DU MÊME DÉFAUT :
          #    le run `a53a8fe` a rendu **`success`**. Tous les fichiers répondaient 200.
          #    ⛔ **Et `/formation/` servait encore l'ANCIENNE page** — titre
          #      « Ressources pédagogiques », canonical `/ressources/`.
          #    En-tête mesuré : `Last-Modified: 12:33:06` — posé par le run **précédent**,
          #    celui qui avait échoué. Le run vert **n'a pas republié le fichier.**
          #
          #    ⇒ ⭐ **Un contrôle de code HTTP vérifie qu'une porte s'ouvre. Il ne vérifie
          #      pas ce qu'il y a derrière.** *C'est le même défaut, une couche plus haut.*
          #    ⇒ **On vérifie maintenant que le CONTENU servi est le nôtre.**
          echo ""
          echo "── Vérification du CONTENU (pas seulement du code) ──"
          # La signature de la page d'accueil doit être présente dans ce qui est servi.
          # ⚠️ Elle est écrite ici, et c'est imparfait — comme toute liste écrite à la main.
          #    *Mais une signature fausse se voit, alors qu'une page périmée ne se voit pas.*
          sig_index=$(curl -s -L --max-time 30 "https://gldigitallab.fr/" | grep -c 'GL Digital Lab' || true)
          if [ "${sig_index:-0}" -gt 0 ]; then
            echo "  ✅ la page d'accueil porte bien « GL Digital Lab »"
          else
            echo "  ⛔ la page d'accueil ne porte PAS la signature attendue"
            echec=1
          fi

          sig_formation=$(curl -s -L --max-time 30 "https://gldigitallab.fr/formation/" | grep -c 'Suivi de formation\|suivi de formation\|Universitaire' || true)
          if [ "${sig_formation:-0}" -gt 0 ]; then
            echo "  ✅ /formation/ sert bien la version avec les trois niveaux"
          else
            echo "  ⛔ /formation/ sert une version PÉRIMÉE"
            echo "     ⇒ elle répond 200, mais ce n'est pas la page attendue."
            echo "     ⇒ *Un 200 sur une page périmée est un déploiement qui n'a pas livré.*"
            echec=1
          fi
          echo "✅ La racine répond."

      # ⛔⛔ LA SURFACE SERVIE EST-ELLE VERSIONNÉE ? — ajouté le 29/09/2026
      #
      # ⚠️ LE DÉFAUT QUI A PRODUIT CETTE ÉTAPE, ET IL EST LE PLUS GRAVE TROUVÉ À CE JOUR :
      #
      #    `https://gldigitallab.fr/monde/` répondait 200 et publiait **30 documents
      #    internes du studio** — trois rapports d'incident, un plan de réponse à
      #    incident, deux journaux serveur, une transcription portant le nom de la
      #    machine de production, et le nom d'un client. **Aucun `noindex`.**
      #
      #    ⛔ ET AUCUN CONTRÔLE NE POUVAIT LA VOIR, PAS PAR NÉGLIGENCE :
      #       la porte de publication lit les fichiers de `cinematique/`.
      #       `/monde/` **n'est pas dans `cinematique/`** — elle est sur le serveur,
      #       posée par le pipeline Vue arrêté le 26/09, **sans source versionnée**.
      #
      #    ⭐ *Un garde-fou qui ne couvre qu'un chemin est une porte.* Ici, le chemin
      #       manquant n'était pas un fichier : c'était **tout ce qui est servi sans
      #       être dans le dépôt**. Un fichier propre devient sale en étant servi —
      #       et rien ne comparait les deux.
      #
      #    Mesure du 29/09/2026 : **5 surfaces servies sans source** (`/services/`,
      #    `/laboratoire/`, `/eva01/`, `/monde/`, `/contact/`), et **19 bloquants** de
      #    publication sur trois d'entre elles quand on les passe au contrôle.
      #
      # ⛔ CE N'EST PAS ENCORE UNE PORTE, ET ELLE LE DIT. Elle ne bloque pas, parce
      #    qu'elle échouerait à CHAQUE déploiement tant que les 5 pages ne sont pas
      #    tranchées — et **un garde-fou qu'on ne peut pas satisfaire est un garde-fou
      #    qu'on désactive**. Ici elle **mesure et publie l'écart** dans le journal du
      #    run, pour qu'il ne dépende plus de quelqu'un qui pense à le chercher.
      #    ⇒ Le jour où les 5 surfaces sont tranchées, on retire `continue-on-error`.
      #
      # ⚠️ SA LIMITE, ÉCRITE POUR QU'ON NE LA PRENNE PAS POUR UN BALAYAGE : le serveur
      #    n'expose aucun listage. Cet outil confronte **la liste de
      #    `outils/surfaces-publiques.json`** — pas l'intégralité de `public_html/`.
      #    Une page en ligne absente de cette liste reste invisible. *Un contrôle dont
      #    on ignore la limite finit par être cru au-delà de ce qu'il fait.*
      - name: 🔭 Surface servie — dépôt ↔ serveur (RAPPORT, ne bloque pas)
        continue-on-error: true
        run: |
          echo "⛔ Écart mesuré, PAS un échec de déploiement. Voir le commentaire du workflow."
          node outils/comparer-depot-serveur.mjs || true

