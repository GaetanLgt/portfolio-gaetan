# ============================================================================
# GL DIGITAL LAB - Pipeline CI/CD Complet
# ============================================================================
# 🔍 Lint & Format check
# 🧪 Tests (si présents)
# 📦 Build production
# 📊 Lighthouse audit
# 🚀 Deploy FTP
# 💬 Notification Discord (optionnel)
# ============================================================================

name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Node 22 et non 20 : le prérendu (scripts/prerendre.js) pilote Chrome par le
  # protocole de débogage et a besoin du WebSocket global, absent de Node 20.
  # Le build ÉCHOUE si une URL du sitemap rend une page 404 — c'est voulu :
  # le déploiement ne doit pas partir avec un plan de site faux.
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Lint & Quality Check
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check  (NE FAIT RIEN — voir le commentaire)
        # ⚠️ CETTE ÉTAPE NE VÉRIFIE RIEN, ET ELLE DOIT LE DIRE.
        # Constaté le 13/09/2026 : `package.json` ne déclare **aucun script `lint`**,
        # il n'existe **aucune configuration ESLint** dans le dépôt, et **aucune
        # dépendance ESLint** n'est installée. `npm run lint --if-present` sort donc
        # en 0 sans rien exécuter, et `continue-on-error` couvre le reste.
        #
        # Deux lectures, et la seconde est la bonne :
        #   · c'est un échafaudage honnête — `--if-present` est la façon standard
        #     d'écrire une CI qui tolère un script absent ;
        #   · MAIS LE NOM MENT. Un job « Lint & Quality » avec une étape « Lint check »
        #     laisse croire que le code est vérifié. **Un verrou qui ne peut pas
        #     échouer n'est pas un verrou, c'est un tampon** — la formule est du
        #     studio, et elle s'applique ici.
        #
        # On garde l'échafaudage (il servira le jour où un linter arrive) et on
        # supprime la fausse impression : même traitement que « Check file sizes ».
        run: |
          echo "⚠️  AUCUN LINTER N'EST CONFIGURÉ DANS CE DÉPÔT."
          echo "    'npm run lint --if-present' ne vérifie RIEN : le script est absent,"
          echo "    il n'y a ni configuration ESLint ni dépendance ESLint installée."
          echo "    Cette étape ne peut pas échouer. Elle est conservée pour le jour où"
          echo "    un linter sera ajouté — d'ici là, elle ne doit pas être prise pour un verrou."
          npm run lint --if-present || true

      - name: 📏 Check file sizes  (INFORMATIF — ce n'est pas un verrou)
        # ⚠ CETTE ÉTAPE N'EST PAS UN VERROU, ET ELLE NE DOIT PAS ÊTRE PRISE POUR UN.
        # `find … -exec ls -lh` AFFICHE, et ne sort jamais en erreur : quoi qu'il
        # trouve, le job continue. Elle regarde de plus `src/`, dont la taille ne
        # dit rien de ce que le visiteur télécharge — Vite hache, découpe et
        # compresse ensuite.
        #
        # Le seul verrou chiffré de la charte qui porte sur le poids, « < 1 MB par
        # page », n'avait donc aucun juge : `verifier-verrous.mjs` renvoyait la
        # question ici, et ici personne ne jugeait. Constaté le 13/09/2026.
        # Il est désormais tenu par `scripts/verifier-poids.mjs`, dans le job
        # `build`, sur `dist/` — là où le chiffre existe vraiment.
        run: |
          echo "📊 Checking large files..."
          find src -name "*.vue" -size +100k -exec ls -lh {} \;
          find src -name "*.js" -size +100k -exec ls -lh {} \;

      - name: 🔒 Verrous de la signature qualité
        # Les verrous (AA · reduced-motion · curseur natif · mode sobre · garde-fou
        # juridique) ne vivaient que dans des COMMENTAIRES. Ce dépôt en a déjà payé
        # le prix : `cursor: none` a survécu au retrait du curseur personnalisé —
        # masquer le curseur système sans remplaçant laisse le visiteur SANS curseur.
        # Un verrou décrit dans un commentaire n'est pas un verrou : c'est une
        # intention. Cette étape le transforme en mesure, et échoue s'il casse.
        #
        # Elle lit les jetons RÉELLEMENT définis dans variables.css, donc elle suit
        # automatiquement tout changement de palette (D1 clair, D4/D5 sombre, ...).
        # Constaté le 11/09/2026 : elle a signalé --alert à 4,45:1 (seuil 4,5) et
        # --rule-strong à 1,96:1 (seuil 3) — deux défauts réels, corrigés depuis.
        run: node scripts/verifier-verrous.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Test
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 📦 Build & Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests  (NE FAIT RIEN — voir le commentaire)
        # ⚠️ Même constat que pour le lint, mesuré le 13/09/2026 : `package.json` ne
        # déclare **aucun script `test`**, et **aucun cadre de test** (vitest, jest…)
        # n'est installé. L'étape sort en 0 sans rien exécuter.
        #
        # Le dire ici plutôt que de laisser croire que le projet est testé.
        run: |
          echo "⚠️  AUCUN TEST N'EST CONFIGURÉ DANS CE DÉPÔT."
          echo "    'npm test --if-present' n'exécute RIEN : le script est absent et"
          echo "    aucun cadre de test n'est installé."
          npm test --if-present || true

      - name: 🔨 Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📊 Build stats
        run: |
          echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -exec ls -lh {} \; | awk '{print "| " $9 " | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total dist size:** $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: 🧮 Requêtes du premier chargement
        # Le verrou qui manquait. `verifier-verrous.mjs` couvre AA, reduced-motion,
        # curseur, jetons de couleur, typographie — et renvoie le POIDS à l'étape
        # « Check file sizes ». Mais la contrainte d'o2switch n'est pas la taille,
        # c'est la RAFALE : ~20 requêtes rapprochées par IP renvoient un 429, et
        # l'application ne se monte pas (ni navigation, ni pied de page, ni
        # bandeau). Mesuré le 11/09/2026 : 12 requêtes, seuil 14.
        #
        # Cette étape tourne APRÈS le build, et c'est délibéré : compter depuis
        # src/ sous-estime (Vite n'a encore ni haché les noms, ni produit le
        # vendor, ni posé le modulepreload). Un verrou qui reçoit l'information
        # et la jette est un rituel.
        run: node scripts/verifier-requetes.mjs --detail

      - name: ⚖️ Poids du premier chargement, par page
        # Le verrou chiffré de la charte : « < 1 MB par page ». Il n'était vérifié
        # nulle part — `verifier-verrous.mjs` renvoyait à « Check file sizes », qui
        # affiche sans jamais échouer.
        #
        # Mesure, page par page, les ressources que chaque page HTML demande au
        # premier chargement, depuis `dist/`. Textes compressés en gzip niveau 6
        # (ce que le serveur sert réellement), binaires pris sur disque (woff2,
        # jpg… sont déjà compressés). **Aucune dépendance à la machine** : c'est un
        # compte d'octets, pas un score — il ne peut donc pas varier comme le score
        # Lighthouse en environnement sans carte graphique.
        #
        # Mesuré le 13/09/2026, build du 11/09 : page la plus lourde = accueil,
        # 12 requêtes, 333,4 Ko servis sur un seuil de 1 024 Ko (marge 690,6 Ko).
        run: node scripts/verifier-poids.mjs --detail

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          # ⚠ INDISPENSABLE : par défaut, upload-artifact écarte les fichiers
          # cachés. Vérifié le 10/09/2026 en téléchargeant l'artefact : il ne
          # contenait AUCUN fichier commençant par un point, donc `public/.htaccess`
          # n'arrivait jamais jusqu'au job de déploiement — les règles Apache du
          # serveur étaient restées figées à leur version d'origine.
          include-hidden-files: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Lighthouse Audit (partout — la condition « PR only » est retirée)
  # ═══════════════════════════════════════════════════════════════════════════
  lighthouse:
    name: 🔦 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build

    # ═══════════════════════════════════════════════════════════════════════════
    # CORRIGÉ LE 13/09/2026 — CE JOB NE VERROUILLAIT RIEN. TROIS DÉFAUTS.
    #
    # ① IL NE TOURNAIT QUE SUR LES PULL REQUESTS (`if: github.event_name ==
    #    'pull_request'`). Or ce dépôt déploie **au push sur `main`** : l'audit ne
    #    tournait donc JAMAIS sur le chemin qui met le site en ligne, seulement sur
    #    des PR qui n'arrivent pas quand on pousse directement sur main.
    #    → la condition est retirée : l'audit tourne partout.
    #
    # ② `temporaryPublicStorage: true` TÉLÉVERSAIT LE RAPPORT SUR UN STOCKAGE
    #    PUBLIC TIERS. Deux problèmes : la doctrine du studio est « aucun envoi vers
    #    un service externe », et un rapport Lighthouse contient des extraits de la
    #    page. **Ce paramètre annulait aussi le correctif de `.lighthouserc.json`**,
    #    qui déclare `upload: filesystem` — ici, c'est le workflow qui gagne.
    #    → passé à `false`. `uploadArtifacts` reste : l'artefact est privé au dépôt.
    #
    # ③ `continue-on-error: true` — **LE DÉFAUT QUI ANNULE TOUT LE RESTE.** Même
    #    quand l'audit échoue, le job réussit. Un verrou dont l'échec est ignoré
    #    n'est pas un verrou : c'est un tampon — la formule est du studio, et elle
    #    s'applique à lui-même.
    #    → retiré. L'audit peut désormais ÉCHOUER, et ça se verra.
    #
    # ⚠️ CE JOB NE BLOQUE PAS LE DÉPLOIEMENT, ET C'EST VOULU. `deploy` a
    #    `needs: build`, pas `needs: lighthouse` — les deux tournent en parallèle.
    #    Sur ce dépôt, *pousser EST mettre en ligne*, et cette décision appartient à
    #    Gaëtan, pas à un audit automatique. Le rôle de ce job est de **dire la
    #    vérité en rouge**, pas de retenir la publication.
    # ═══════════════════════════════════════════════════════════════════════════

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔦 Run Lighthouse
        # ⚠ TROIS RÉSERVES MESURÉES LE 13/09/2026, À NE PAS OUBLIER.
        #
        # ① L'INSTRUMENT N'EST PAS ÉPINGLÉ, ET CE N'EST PAS CELUI DES MESURES DE
        #    RÉFÉRENCE. `treosh/lighthouse-ci-action@v11` embarque son propre
        #    Lighthouse : exécuté sur ce poste, `@lhci/cli@0.14.0` a mesuré avec
        #    **Lighthouse 12.1.0**, alors que les mesures consignées dans
        #    `docs/mesurer-la-performance.md` et `modeles/mesure-lighthouse-production-
        #    2026-09-10.md` sont faites avec **13.4.1**. Une version majeure d'écart,
        #    ce n'est pas le même barème : comparer un score de 13.x à un seuil jugé
        #    par 12.x, c'est comparer deux instruments. **À trancher par Gaëtan.**
        #
        # ② `numberOfRuns: 3` (dans .lighthouserc.json) — la doctrine du studio est
        #    « trois tirs, médiane, jamais le meilleur ni le pire ». Le fichier disait
        #    `1` : un seul tir, donc un verdict qui peut basculer sur un aléa de
        #    machine. Corrigé.
        #
        # ③ SUR CE POSTE, LE TIR AVORTE — ET PAS POUR UNE RAISON DE SITE. Le
        #    collecteur `RootCauses` lève « Cannot read properties of undefined
        #    (reading 'frame_sequence') », ce qui fait tomber six audits
        #    (dont `render-blocking-resources`), puis la sortie est en erreur sur un
        #    `EPERM` de nettoyage de profil temporaire Windows. **Le code de sortie 1
        #    ne dit donc rien du site.** C'est un artefact de mesure, de la famille
        #    exacte du `--disable-gpu` déjà payé — et c'est pourquoi ce verrou ne
        #    peut pas être jugé depuis ce poste.
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: false

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: 📥 Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      # ⚠ `.htaccess` : DEUX barrières l'empêchaient d'arriver sur le serveur
      # (constaté le 10/09/2026, journal du déploiement et artefact à l'appui) :
      #   1. `upload-artifact` écartait les fichiers cachés (corrigé ci-dessus) ;
      #   2. l'action FTP n'en parle jamais dans son plan d'envoi (164 fichiers
      #      listés, zéro `.htaccess`) — elle aussi ignore les fichiers cachés.
      # Conséquence mesurée en production : `/arcade` répondait encore 200 avec la
      # page d'accueil alors que le nouveau .htaccess prévoyait un vrai 404, et
      # /assets/ listait toujours ses fichiers. On l'envoie donc explicitement,
      # et l'étape ÉCHOUE si l'envoi échoue : un routage non appliqué en silence
      # est exactement le piège qu'on vient de payer.
      - name: 📄 Envoyer .htaccess (fichier caché, ignoré par les deux étapes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "envoi de dist/.htaccess ($(wc -c < dist/.htaccess) octets)"
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file dist/.htaccess \
            "ftp://$FTP_SERVER/public_html/.htaccess"
          echo "✅ .htaccess envoyé"

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Site:** https://gldigitallab.fr" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "🔖 **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: Notify Discord (optionnel)
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: 💬 Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 💬 Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "GL Digital Lab Deployment"
          description: |
            **Commit:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}
          url: "https://gldigitallab.fr"
          color: ${{ needs.deploy.result == 'success' && '0x10b981' || '0xef4444' }}
        continue-on-error: true
