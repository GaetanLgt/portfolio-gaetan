# ============================================================================
# GL DIGITAL LAB - Pipeline CI/CD Complet
# ============================================================================
# 🔍 Lint & Format check
# 🧪 Tests (si présents)
# 📦 Build production
# 📊 Lighthouse audit
# 🚀 Deploy FTP
# 💬 Notification Discord (optionnel)
# ============================================================================

name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Node 22 et non 20 : le prérendu (scripts/prerendre.js) pilote Chrome par le
  # protocole de débogage et a besoin du WebSocket global, absent de Node 20.
  # Le build ÉCHOUE si une URL du sitemap rend une page 404 — c'est voulu :
  # le déploiement ne doit pas partir avec un plan de site faux.
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Lint & Quality Check
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint --if-present
        continue-on-error: true

      - name: 📏 Check file sizes
        run: |
          echo "📊 Checking large files..."
          find src -name "*.vue" -size +100k -exec ls -lh {} \;
          find src -name "*.js" -size +100k -exec ls -lh {} \;

      - name: 🔒 Verrous de la signature qualité
        # Les verrous (AA · reduced-motion · curseur natif · mode sobre · garde-fou
        # juridique) ne vivaient que dans des COMMENTAIRES. Ce dépôt en a déjà payé
        # le prix : `cursor: none` a survécu au retrait du curseur personnalisé —
        # masquer le curseur système sans remplaçant laisse le visiteur SANS curseur.
        # Un verrou décrit dans un commentaire n'est pas un verrou : c'est une
        # intention. Cette étape le transforme en mesure, et échoue s'il casse.
        #
        # Elle lit les jetons RÉELLEMENT définis dans variables.css, donc elle suit
        # automatiquement tout changement de palette (D1 clair, D4/D5 sombre, ...).
        # Constaté le 11/09/2026 : elle a signalé --alert à 4,45:1 (seuil 4,5) et
        # --rule-strong à 1,96:1 (seuil 3) — deux défauts réels, corrigés depuis.
        run: node scripts/verifier-verrous.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Test
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 📦 Build & Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: 🔨 Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📊 Build stats
        run: |
          echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -exec ls -lh {} \; | awk '{print "| " $9 " | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total dist size:** $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: 🧮 Requêtes du premier chargement
        # Le verrou qui manquait. `verifier-verrous.mjs` couvre AA, reduced-motion,
        # curseur, jetons de couleur, typographie — et renvoie le POIDS à l'étape
        # « Check file sizes ». Mais la contrainte d'o2switch n'est pas la taille,
        # c'est la RAFALE : ~20 requêtes rapprochées par IP renvoient un 429, et
        # l'application ne se monte pas (ni navigation, ni pied de page, ni
        # bandeau). Mesuré le 11/09/2026 : 12 requêtes, seuil 14.
        #
        # Cette étape tourne APRÈS le build, et c'est délibéré : compter depuis
        # src/ sous-estime (Vite n'a encore ni haché les noms, ni produit le
        # vendor, ni posé le modulepreload). Un verrou qui reçoit l'information
        # et la jette est un rituel.
        run: node scripts/verifier-requetes.mjs --detail

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          # ⚠ INDISPENSABLE : par défaut, upload-artifact écarte les fichiers
          # cachés. Vérifié le 10/09/2026 en téléchargeant l'artefact : il ne
          # contenait AUCUN fichier commençant par un point, donc `public/.htaccess`
          # n'arrivait jamais jusqu'au job de déploiement — les règles Apache du
          # serveur étaient restées figées à leur version d'origine.
          include-hidden-files: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Lighthouse Audit (on PR only)
  # ═══════════════════════════════════════════════════════════════════════════
  lighthouse:
    name: 🔦 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔦 Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: 📥 Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      # ⚠ `.htaccess` : DEUX barrières l'empêchaient d'arriver sur le serveur
      # (constaté le 10/09/2026, journal du déploiement et artefact à l'appui) :
      #   1. `upload-artifact` écartait les fichiers cachés (corrigé ci-dessus) ;
      #   2. l'action FTP n'en parle jamais dans son plan d'envoi (164 fichiers
      #      listés, zéro `.htaccess`) — elle aussi ignore les fichiers cachés.
      # Conséquence mesurée en production : `/arcade` répondait encore 200 avec la
      # page d'accueil alors que le nouveau .htaccess prévoyait un vrai 404, et
      # /assets/ listait toujours ses fichiers. On l'envoie donc explicitement,
      # et l'étape ÉCHOUE si l'envoi échoue : un routage non appliqué en silence
      # est exactement le piège qu'on vient de payer.
      - name: 📄 Envoyer .htaccess (fichier caché, ignoré par les deux étapes)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "envoi de dist/.htaccess ($(wc -c < dist/.htaccess) octets)"
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file dist/.htaccess \
            "ftp://$FTP_SERVER/public_html/.htaccess"
          echo "✅ .htaccess envoyé"

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Site:** https://gldigitallab.fr" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "🔖 **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: Notify Discord (optionnel)
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: 💬 Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 💬 Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "GL Digital Lab Deployment"
          description: |
            **Commit:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}
          url: "https://gldigitallab.fr"
          color: ${{ needs.deploy.result == 'success' && '0x10b981' || '0xef4444' }}
        continue-on-error: true
