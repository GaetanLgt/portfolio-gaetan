# ============================================================================
# GL DIGITAL LAB - Pipeline CI/CD Complet
# ============================================================================
# 🔍 Lint & Format check
# 🧪 Tests (si présents)
# 📦 Build production
# 📊 Lighthouse audit
# 🚀 Deploy FTP
# 💬 Notification Discord (optionnel)
# ============================================================================

name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Lint & Quality Check
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint --if-present
        continue-on-error: true

      - name: 📏 Check file sizes
        run: |
          echo "📊 Checking large files..."
          find src -name "*.vue" -size +100k -exec ls -lh {} \;
          find src -name "*.js" -size +100k -exec ls -lh {} \;

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Test
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: 📦 Build & Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: 🔨 Build production
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📊 Build stats
        run: |
          echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -exec ls -lh {} \; | awk '{print "| " $9 " | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total dist size:** $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Lighthouse Audit (on PR only)
  # ═══════════════════════════════════════════════════════════════════════════
  lighthouse:
    name: 🔦 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🔦 Run Lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: 📥 Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 🚀 Deploy assets (hors index.html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/index.html

      # ⚠️ CRITIQUE : index.html est uploadé EN DERNIER. L'ancien index.html
      # (qui référence les anciens assets, toujours présents sur le serveur)
      # reste servi pendant tout l'upload des nouveaux assets → AUCUNE fenêtre
      # de page blanche. Le nouveau HTML n'arrive que quand tous ses assets
      # existent déjà.
      - name: 📦 Préparer index.html seul
        run: |
          mkdir -p dist-html
          cp dist/index.html dist-html/index.html

      - name: 🚀 Deploy index.html (dernier, anti-page-blanche)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-html/
          server-dir: /public_html/
          dangerous-clean-slate: false

      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Site:** https://gldigitallab.fr" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "🔖 **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: Notify Discord (optionnel)
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: 💬 Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 💬 Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.deploy.result }}
          title: "GL Digital Lab Deployment"
          description: |
            **Commit:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}
          url: "https://gldigitallab.fr"
          color: ${{ needs.deploy.result == 'success' && '0x10b981' || '0xef4444' }}
        continue-on-error: true
