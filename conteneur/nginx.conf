# ============================================================
# nginx.conf — SERT `dist/` POUR LE REGARDER, PAS POUR HÉBERGER
# ============================================================
# ⛔ CE FICHIER N'EST PAS LA PRODUCTION.
#
#   La production, c'est **o2switch, sous Apache, réglé par un `.htaccess`**
#   (`public/.htaccess`, 189 lignes, recopié en tête de `dist/` par Vite).
#   Changer d'hébergeur est une décision du dirigeant, pas la nôtre.
#
#   Ce serveur-ci sert à UNE chose : ouvrir le site construit dans un
#   navigateur et vérifier de ses yeux ce que le build a produit sur le
#   disque. Il ne fait PAS : redirection HTTPS, redirection www, HSTS.
#
# ⭐ CE QU'IL REPRODUIT, EN REVANCHE, ET QUI SE VÉRIFIE :
#   · les en-têtes de sécurité du `.htaccess` (CSP, X-Frame-Options,
#     nosniff, Referrer-Policy, Permissions-Policy) — recopiés à
#     l'identique depuis `public/.htaccess` § 6 ;
#   · le VRAI code 404 sur une adresse inconnue (le `.htaccess` § 8 a
#     supprimé le repli SPA vers /index.html le 10/09/2026 : un repli
#     renvoyait HTTP 200 avec la page d'accueil, donc un doublon pour
#     les moteurs) ;
#   · le refus de lister un dossier (`Options -Indexes` dans
#     `.htaccess` § 3) ;
#   · les mêmes règles de cache (HTML non mis en cache, JS/CSS/polices
#     un an — Vite ajoute un hash au nom) ;
#   · la compression gzip (§ 4).
#
# ⚠️ ET CE QU'IL NE PROUVE PAS, ÉCRIT NOIR SUR BLANC :
#   · que les règles de réécriture APACHE fonctionnent (elles ne sont
#     pas interprétées ici : `RewriteEngine`, `mod_headers`,
#     `mod_expires`, `mod_deflate` n'existent pas sous nginx) ;
#   · que le `.htaccess` est bien PRIS EN COMPTE par o2switch ;
#   · que la redirection HTTPS et www fonctionne ;
#   · que le déploiement FTP aboutit.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # `.htaccess` § 3 : « Options -Indexes ». Un dossier sans index.html
    # ne se liste JAMAIS — un dossier créé mais pas encore rempli pendant
    # un déploiement FTP affichait « Index of /services » en direct.
    autoindex off;

    # `.htaccess` § 4 : compression.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/html text/css text/javascript text/plain text/xml
                      application/javascript application/json application/xml
                      application/rss+xml application/atom+xml image/svg+xml;

    # Les types que `.htaccess` § 7 déclare explicitement.
    types {
        text/html                             html htm;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg svgz;
        image/webp                            webp;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/x-icon                          ico;
        font/woff                             woff;
        font/woff2                            woff2;
        application/xml                       xml;
        text/plain                            txt;
        video/mp4                             mp4;
        model/gltf-binary                     glb;
    }

    # ---- En-têtes de sécurité — recopiés de `public/.htaccess` § 6 ----
    # ⚠️ Si le `.htaccess` change, CE BLOC DOIT CHANGER AUSSI, sinon le
    # conteneur servira une politique que la production n'a plus.
    #
    # ⛔⛔ POURQUOI CE BLOC EST RÉPÉTÉ TROIS FOIS DANS CE FICHIER — MESURÉ.
    #
    # Sous nginx, `add_header` ne s'hérite QUE si le niveau courant n'en
    # définit AUCUN. Un seul `add_header` dans un `location` fait donc
    # disparaître TOUS ceux du niveau `server`.
    #
    # Le défaut a été mesuré le 22/09/2026, sur ce fichier même, première
    # version : `location ~* \.html$` posait un `Cache-Control`, et la page
    # d'accueil répondait 200 avec **zéro en-tête de sécurité** :
    #     Content-Security-Policy = ABSENT
    #     X-Frame-Options = ABSENT
    #     X-Content-Type-Options = ABSENT
    #     Referrer-Policy = ABSENT
    #     Permissions-Policy = ABSENT
    # alors que le bloc `server` les déclarait. *Un garde-fou qui ne couvre
    # qu'un chemin est une porte* — ici, il n'en couvrait plus aucun.
    #
    # D'où la répétition : toute section qui pose un en-tête de cache doit
    # repoSer la politique complète. Si vous en ajoutez une, faites pareil.
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header X-XSS-Protection         "1; mode=block"                  always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    # HSTS est VOLONTAIREMENT ABSENT : il n'a aucun sens sur du HTTP local,
    # et l'envoyer ferait bloquer le navigateur sur `http://localhost`.
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.gldigitallab.fr; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://analytics.gldigitallab.fr; font-src 'self' data:; connect-src 'self' blob: https://analytics.gldigitallab.fr; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # ---- Cache — mêmes règles que `.htaccess` § 5 et § 6 ----
    # Assets hashés : un an, immuable. ⚠️ La politique de sécurité est
    # répétée ici POUR LA RAISON DITE CI-DESSUS.
    location ~* \.(js|mjs|css|woff2?)$ {
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header X-XSS-Protection         "1; mode=block"                  always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.gldigitallab.fr; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://analytics.gldigitallab.fr; font-src 'self' data:; connect-src 'self' blob: https://analytics.gldigitallab.fr; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML : jamais mis en cache. ⚠️ Politique répétée, même raison.
    location ~* \.html$ {
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header X-XSS-Protection         "1; mode=block"                  always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.gldigitallab.fr; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://analytics.gldigitallab.fr; font-src 'self' data:; connect-src 'self' blob: https://analytics.gldigitallab.fr; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        try_files $uri =404;
    }

    # ---- Le vrai 404, pas un repli SPA ----
    # `.htaccess` § 8 : « ErrorDocument 404 /404.html ».
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Les fichiers cachés d'éditeur ou de dépôt ne se servent pas.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
